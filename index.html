<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>トロッコアドベンチャー</title>

    <!-- 0. 認証前の画面隠しCSS -->
    <style id="auth-style">
        body { display: none !important; }
    </style>

    <!-- 1. 画面デザイン・スタイル設定 (CSS) -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* スクロール禁止 */
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }

        /* 背景メディアエリア */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* タイトルUI表示レイヤー */
        .ui-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
        }

        .title {
            font-size: 3.5rem;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        /* 入力待機テキストの点滅 */
        .start-msg {
            font-size: 1.5rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
    </style>

    <!-- 2. ゲームロジック・進行管理 (JavaScript) -->
    <script>
        // --- A. パスワード認証 ---
        const TARGET_HASH = "5817ae4948371f9b6b7d94615c0704e6a13ba5a773938351ebd832d0fcdbdf2f";

        async function sha256(str) {
            const buff = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buff))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        function revealPage() {
            const styleTag = document.getElementById("auth-style");
            if (styleTag) styleTag.remove();
        }

        (async function checkAuth() {
            while (true) {
                const userInput = prompt("Enter password:");
                if (userInput === null) {
                    alert("Authentication canceled");
                    window.location.href = "about:blank";
                    return;
                }
                const inputHash = await sha256(userInput);
                if (inputHash === TARGET_HASH) {
                    if (document.readyState === "loading") {
                        document.addEventListener("DOMContentLoaded", revealPage);
                    } else {
                        revealPage();
                    }
                    return;
                }
                alert("Incorrect password");
            }
        })();


        // --- B. メディア一括管理 ---
        // 将来映像や画像を追加する際は、ここを書き換えます
        const MEDIA_PATHS = {
            TITLE:      { video: "media/bg-title.mp4", poster: "media/bg-title.PNG" }, //imakoko
            GENRE:      { video: "media/bg-genre.mp4", poster: "media/bg-genre.JPG" },
            DIFFICULTY: { video: "media/bg-diff.mp4", poster: "media/bg-diff.JPG" },
            PROGRESS:   { video: "media/bg-progress.mp4", poster: "media/bg-progress.JPG" },
            QUESTION:   { video: "media/bg-quiz.mp4", poster: "media/bg-quiz.JPG" },
            FALL:       { video: "media/bg-fall.mp4", poster: "media/bg-fall.JPG" },
            GAMEOVER:   { video: "media/bg-gameover.mp4", poster: "media/bg-gameover.JPG" },
            CLEAR:      { video: "media/bg-clear.mp4", poster: "media/bg-clear.JPG" }
        };


        // --- C. フェーズ定義（状態管理） ---
        const GAME_STATES = {
            TITLE: "TITLE",           // ① Title
            GENRE: "GENRE",           // ② Genre
            DIFFICULTY: "DIFFICULTY", // ③ Difficulty
            PROGRESS: "PROGRESS",     // ④ 道中の進行（旧 DEPARTURE）
            QUESTION: "QUESTION",     // ⑤ 出題画面 / ⑥ 回答
            FALL: "FALL",             // ⑦-II 落下演出
            GAMEOVER: "GAMEOVER",     // ⑧-II Gameover
            CLEAR: "CLEAR"            // ⑧-I Clear
        };

        // 現在のフェーズ（初期値：タイトル画面）
        let currentState = GAME_STATES.TITLE;


        // --- D. キー入力待機（タイトル画面） ---
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault(); // スクロール防止
            }

            if (currentState === GAME_STATES.TITLE) {
                if (e.code === "Enter" || e.code === "Space") {
                    console.log("タイトル画面での入力検出（Enter / Space）");
                    // ※次のフェーズ実装時にここへ遷移処理を記述します
                }
            }
        });
    </script>
</head>
<body>

    <!-- 背景メディア領域 -->
    <div class="bg-container">
        <video id="bg-video" class="bg-media" autoplay loop muted playsinline poster="media/bg-title.JPG">
            <source src="" type="video/mp4">
        </video>
    </div>

    <!-- ① タイトル画面UI（入力待機） -->
    <div id="ui-title" class="ui-layer">
        <h1 class="title">Title!!</h1>
        <p class="start-msg">PRESS ENTER TO START</p>
    </div>

</body>
</html>
