<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>トロッコアドベンチャー</title>
    <style>
        /* ==========================================================================
           1. 画面全体の基本スタイル
           ========================================================================== */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* スクロールバーを非表示にして全画面表示に対応 */
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
            user-select: none; /* テキスト選択を無効化 */
            cursor: none;      /* マウスカーソルを非表示 */
        }
        /* ==========================================================================
           2. 背景メディア（画像・動画）レイアウト
           ========================================================================== */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* UI要素より背面に配置 */
        }
        .bg-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 画面比率に関わらず全画面を覆うように拡大縮小 */
        }
        /* 静止画（ポスター画像）の設定 */
        #bg-img {
            z-index: 1;
            display: block;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
        /* 背景動画の設定（クロスフェード切り替え用） */
        #bg-video {
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease; /* 再生開始時に滑らかに表示 */
        }
        #bg-video.active {
            opacity: 1;
        }
        /* 画面非表示用クラス */
        .hidden { display: none !important; }

        /* ==========================================================================
           3. パスワード認証モーダル
           ========================================================================== */
        #auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100; /* 最前面に表示 */
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .auth-box {
            background: #222;
            width: 200px;
            padding: 20px;
            border-radius: 20px;
            border: 3px solid #555;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            box-sizing: border-box;
        }
        .auth-box h2 {
            font-size: 12px;
            margin: 0 0 20px 0;
            color: #fff;
            text-shadow: none;
        }
        .auth-input {
            width: 100%;
            font-size: 10px;
            padding: 5px 7.5px;
            border-radius: 8px;
            border: 2px solid #ccc;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }
        .auth-error {
            color: #ff4d4d;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            text-shadow: none;
        }

        /* ==========================================================================
           4. UIレイヤー（共通設定）
           ========================================================================== */
        .ui-layer {
            position: relative;
            z-index: 10; /* メディアの上に重ねて表示 */
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 2vh 2vw;
            text-shadow: 0 0.4vh 1.5vh rgba(0, 0, 0, 0.95); /* 可認性向上のための影 */
        }

        /* --------------------------------------------------------------------------
           4-1. タイトル画面
           -------------------------------------------------------------------------- */
        .title {
            font-size: 12vh;
            margin-bottom: 4vh;
            letter-spacing: 0.1em;
            font-weight: 900;
        }
        .start-msg {
            font-size: 4vh;
            font-weight: bold;
            animation: blink 1.5s infinite; /* 点滅アニメーション */
        }
        .fullscreen-guide {
            position: absolute;
            top: 2vh;
            left: 2vw;
            margin: 0;
            font-size: 2.5vh;
            color: #aaa;
            font-weight: bold;
        }
        /* 点滅用キーフレーム */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* --------------------------------------------------------------------------
           4-2. 選択画面（ジャンル / 難易度）
           -------------------------------------------------------------------------- */
        .section-title {
            font-size: 9vh;
            margin-bottom: 5vh;
            letter-spacing: 0.05em;
            font-weight: bold;
        }
        .card-container {
            display: flex;
            gap: 4vw;
            justify-content: center;
            align-items: center;
            max-width: 90vw;
        }
        /* 選択カード基本スタイル */
        .select-card {
            width: 45vh;
            height: 45vh;
            max-width: 60vw;
            max-height: 60vw;
            background: rgba(0, 0, 0, 0.65);
            border: 0.8vh solid #fff;
            border-radius: 3vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 11vh;
            font-weight: bold;
            box-shadow: 0 2vh 2.5vh rgba(0, 0, 0, 0.9);
            box-sizing: border-box;
        }
        .key-guide {
            margin-top: 5vh;
            font-size: 3vh;
            font-weight: bold;
            color: #eee;
        }

        /* --------------------------------------------------------------------------
           4-3. クイズ画面スタイル & 演出アニメーション
           -------------------------------------------------------------------------- */
        .quiz-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 5vh 5vw;
            box-sizing: border-box;
        }
        /* 問題文ボックス */
        .quiz-question-box {
            background: rgba(0, 0, 0, 0.75);
            border: 0.5vh solid #fff;
            border-radius: 2vh;
            width: 80vw;
            padding: 3vh;
            text-align: center;
            font-size: 5vh;
            font-weight: bold;
            line-height: 1.4;
            box-shadow: 0 1vh 2vh rgba(0, 0, 0, 0.8);
            opacity: 0;
        }
        /* 問題文が出現するポップインアニメーション */
        .quiz-question-box.animate-pop {
            animation: popIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        /* 選択肢コンテナ */
        .quiz-options-container {
            display: flex;
            justify-content: space-between;
            width: 85vw;
            margin-bottom: 5vh;
            opacity: 0;
        }
        /* 選択肢の下からのフェードイン表示 */
        .quiz-options-container.animate-fade {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* 各選択肢カード */
        .quiz-option-card {
            width: 38vw;
            min-height: 25vh;
            background: rgba(0, 0, 0, 0.75);
            border: 0.6vh solid #aaa;
            border-radius: 2vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2vh;
            box-sizing: border-box;
        }
        .option-label {
            font-size: 4vh;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 1vh;
        }
        .option-text {
            font-size: 4.5vh;
            font-weight: bold;
            text-align: center;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 選択肢画像の設定 */
        .option-img {
            max-width: 100%;
            max-height: 18vh;
            object-fit: contain;
            border-radius: 1vh;
        }

        /* --------------------------------------------------------------------------
           4-4. ゲームオーバー・クリア画面
           -------------------------------------------------------------------------- */
        .gameover-title {
            font-size: 13vh;
            color: #ff3333;
            margin-bottom: 4vh;
            letter-spacing: 0.08em;
            font-weight: 900;
        }
        .clear-title {
            font-size: 13vh;
            color: #ffd700;
            margin-bottom: 4vh;
            letter-spacing: 0.08em;
            font-weight: 900;
        }
    </style>
    <script>
        // ==========================================================================
        // 1. 定数・設定データの定義
        // ==========================================================================
        
        // スプレッドシートから公開されたCSVのデータ取得URL
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQbRsUm7p9ttAa6NSNEM-YIRj9Ah7iv4izikbgCemvecrlIMGMl4H80D3wljAFeFHAdFxAoySIBJCkb/pub?gid=0&single=true&output=csv";
        
        // ゲーム内の全状態（ステート）列挙
        const GAME_STATES = {
            TITLE: "TITLE",
            GENRE: "GENRE",
            DIFFICULTY: "DIFFICULTY",
            PROGRESS: "PROGRESS",         // 進行状態（動的マッピング用）
            PROGRESS_0: "PROGRESS_0",
            PROGRESS_1: "PROGRESS_1",
            PROGRESS_2: "PROGRESS_2",
            PROGRESS_3: "PROGRESS_3",
            PROGRESS_4: "PROGRESS_4",
            PROGRESS_5: "PROGRESS_5",     // 第5問正解後の最終進行
            QUESTION: "QUESTION",         // クイズ出題状態（動的マッピング用）
            QUESTION_0: "QUESTION_0",
            QUESTION_1: "QUESTION_1",
            QUESTION_2: "QUESTION_2",
            QUESTION_3: "QUESTION_3",
            QUESTION_4: "QUESTION_4",
            FALL: "FALL",
            GAMEOVER: "GAMEOVER",
            CLEAR: "CLEAR"
        };
        
        // 各ステートにおける背景メディアの設定（動画URL・静止画URL・ループ有無）
        // Progress 1〜5 は左右(L/R) × 正誤(correct/wrong) の計8ファイル（poster 4種 + video 4種）構成
        const MEDIA_PATHS = {
            [GAME_STATES.TITLE]:       { video: "media/bg-title.mp4", poster: "media/bg-title.jpg", loop: true },
            [GAME_STATES.GENRE]:       { video: "media/bg-title.mp4", poster: "media/bg-title.jpg", loop: true },
            [GAME_STATES.DIFFICULTY]:  { video: "media/bg-title.mp4", poster: "media/bg-title.jpg", loop: true },
            [GAME_STATES.PROGRESS_0]:  { video: "media/bg-progress0.mp4", poster: "media/bg-progress0.jpg", loop: false },
            [GAME_STATES.PROGRESS_1]:  { 
                loop: false,
                poster_L_correct: "media/bg-progress1-L-correct.jpg",
                poster_L_wrong:   "media/bg-progress1-L-wrong.jpg",
                poster_R_correct: "media/bg-progress1-R-correct.jpg",
                poster_R_wrong:   "media/bg-progress1-R-wrong.jpg",
                video_L_correct:  "media/bg-progress1-L-correct.mp4",
                video_L_wrong:    "media/bg-progress1-L-wrong.mp4",
                video_R_correct:  "media/bg-progress1-R-correct.mp4",
                video_R_wrong:    "media/bg-progress1-R-wrong.mp4"
            },
            [GAME_STATES.PROGRESS_2]:  { 
                loop: false,
                poster_L_correct: "media/bg-progress2-L-correct.jpg",
                poster_L_wrong:   "media/bg-progress2-L-wrong.jpg",
                poster_R_correct: "media/bg-progress2-R-correct.jpg",
                poster_R_wrong:   "media/bg-progress2-R-wrong.jpg",
                video_L_correct:  "media/bg-progress2-L-correct.mp4",
                video_L_wrong:    "media/bg-progress2-L-wrong.mp4",
                video_R_correct:  "media/bg-progress2-R-correct.mp4",
                video_R_wrong:    "media/bg-progress2-R-wrong.mp4"
            },
            [GAME_STATES.PROGRESS_3]:  { 
                loop: false,
                poster_L_correct: "media/bg-progress3-L-correct.jpg",
                poster_L_wrong:   "media/bg-progress3-L-wrong.jpg",
                poster_R_correct: "media/bg-progress3-R-correct.jpg",
                poster_R_wrong:   "media/bg-progress3-R-wrong.jpg",
                video_L_correct:  "media/bg-progress3-L-correct.mp4",
                video_L_wrong:    "media/bg-progress3-L-wrong.mp4",
                video_R_correct:  "media/bg-progress3-R-correct.mp4",
                video_R_wrong:    "media/bg-progress3-R-wrong.mp4"
            },
            [GAME_STATES.PROGRESS_4]:  { 
                loop: false,
                poster_L_correct: "media/bg-progress4-L-correct.jpg",
                poster_L_wrong:   "media/bg-progress4-L-wrong.jpg",
                poster_R_correct: "media/bg-progress4-R-correct.jpg",
                poster_R_wrong:   "media/bg-progress4-R-wrong.jpg",
                video_L_correct:  "media/bg-progress4-L-correct.mp4",
                video_L_wrong:    "media/bg-progress4-L-wrong.mp4",
                video_R_correct:  "media/bg-progress4-R-correct.mp4",
                video_R_wrong:    "media/bg-progress4-R-wrong.mp4"
            },
            [GAME_STATES.PROGRESS_5]:  { 
                loop: false,
                poster_L_correct: "media/bg-progress5-L-correct.jpg",
                poster_L_wrong:   "media/bg-progress5-L-wrong.jpg",
                poster_R_correct: "media/bg-progress5-R-correct.jpg",
                poster_R_wrong:   "media/bg-progress5-R-wrong.jpg",
                video_L_correct:  "media/bg-progress5-L-correct.mp4",
                video_L_wrong:    "media/bg-progress5-L-wrong.mp4",
                video_R_correct:  "media/bg-progress5-R-correct.mp4",
                video_R_wrong:    "media/bg-progress5-R-wrong.mp4"
            },
            [GAME_STATES.QUESTION_0]:  { video: "media/bg-quiz0.mp4", poster: "media/bg-quiz0.jpg", loop: true },
            [GAME_STATES.QUESTION_1]:  { video: "media/bg-quiz1.mp4", poster: "media/bg-quiz1.jpg", loop: true },
            [GAME_STATES.QUESTION_2]:  { video: "media/bg-quiz2.mp4", poster: "media/bg-quiz2.jpg", loop: true },
            [GAME_STATES.QUESTION_3]:  { video: "media/bg-quiz3.mp4", poster: "media/bg-quiz3.jpg", loop: true },
            [GAME_STATES.QUESTION_4]:  { video: "media/bg-quiz4.mp4", poster: "media/bg-quiz4.jpg", loop: true },
            [GAME_STATES.FALL]:        { video: "media/bg-fall.mp4", poster: "media/bg-fall.JPG", loop: false },
            [GAME_STATES.GAMEOVER]:    { video: "media/bg-gameover.mp4", poster: "media/bg-gameover.JPG", loop: true },
            [GAME_STATES.CLEAR]:       { video: "media/bg-clear.mp4", poster: "media/bg-clear.jpg", loop: true }
        };
        
        // パスワード認証用のハッシュ値
        const TARGET_HASH = "5817ae4948371f9b6b7d94615c0704e6a13ba5a773938351ebd832d0fcdbdf2f";

        // ==========================================================================
        // 2. グローバル変数（システム状態管理）
        // ==========================================================================
        let currentState = GAME_STATES.TITLE; // 現在のゲームステート
        let currentMediaVideo = null;        // 現在再生中の動画パス（重複ロード防止用）
        let isAuthenticated = false;         // パスワード認証フラグ
        let isAnimating = false;             // 問題・選択肢の演出中フラグ（キー割り込み防止用）
        let selectedGenre = "";              // プレイヤーが選択したジャンル
        let selectedDifficulty = "";         // プレイヤーが選択した難易度
        let questionCount = 0;               // 現在の進行問題インデックス（0〜4）
        let questionDatabase = [];           // CSVからロードした問題データリスト
        let currentQuestion = null;          // 現在表示中の問題オブジェクト

        // ==========================================================================
        // 3. ユーティリティ・システム制御関数
        // ==========================================================================
        /**
         * 全画面表示の切り替え（トグル）
         */
        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        /**
         * 文字列の SHA-256 ハッシュ値を計算
         */
        async function sha256(str) {
            const buff = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buff))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        /**
         * 外部スプレッドシートから問題データ（CSV）を取得
         */
        async function fetchQuestions() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (error) {
                console.error("問題データの取得に失敗しました:", error);
            }
        }

        /**
         * CSV文字列をパースして `questionDatabase` に格納
         */
        function parseCSV(text) {
            const lines = text.trim().split("\n");
            questionDatabase = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(",").map(col => col.trim().replace(/^"|"$/g, ''));
                if (cols.length >= 7) {
                    questionDatabase.push({
                        genre: cols[0],
                        difficulty: cols[1].toUpperCase(),
                        step: parseInt(cols[2], 10),
                        question: cols[3],
                        optionA: cols[4],
                        optionB: cols[5],
                        answer: cols[6].toUpperCase()
                    });
                }
            }
        }

        /**
         * メディアファイル（画像・動画）のプリロード処理
         */
        function preloadMedia() {
            Object.values(MEDIA_PATHS).forEach(media => {
                Object.values(media).forEach(val => {
                    if (typeof val === "string") {
                        if (/\.(jpg|jpeg|png|gif|webp|svg)$/i.test(val)) {
                            const img = new Image();
                            img.src = val;
                        } else if (/\.(mp4|webm|mov)$/i.test(val)) {
                            const req = new XMLHttpRequest();
                            req.open('GET', val, true);
                            req.responseType = 'blob';
                            req.send();
                        }
                    }
                });
            });
        }

        /**
         * 指定されたステートに対応する背景メディア（静止画および動画）の再生切り替え
         */
        function playMedia(stateKey) {
            const media = MEDIA_PATHS[stateKey];
            if (!media) return;

            const imgElem = document.getElementById("bg-img");
            const videoElem = document.getElementById("bg-video");

            // デフォルト画像または分岐用の代表画像を取得
            const posterSrc = media.poster || media.poster_L_correct || null;
            // デフォルト動画または分岐用の代表動画を取得
            const videoSrc = media.video || media.video_L_correct || null;

            if (posterSrc) {
                imgElem.src = posterSrc;
                imgElem.style.display = "block";
            } else {
                imgElem.removeAttribute("src");
                imgElem.style.display = "none";
            }

            videoElem.loop = media.loop !== false;
            if (videoSrc) {
                if (currentMediaVideo !== videoSrc) {
                    currentMediaVideo = videoSrc;
                    videoElem.src = videoSrc;
                    
                    videoElem.onerror = () => {
                        videoElem.classList.remove("active");
                        currentMediaVideo = null;
                    };

                    const playPromise = videoElem.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            videoElem.classList.add("active");
                        }).catch(() => {
                            videoElem.classList.remove("active");
                        });
                    }
                }
            } else {
                currentMediaVideo = null;
                videoElem.classList.remove("active");
                videoElem.removeAttribute("src");
                videoElem.load();
            }
        }

        // ==========================================================================
        // 4. UI・クイズロジック関連関数
        // ==========================================================================

        /**
         * 選択されたカードを中央に寄せて拡大し、非選択カードを縮小しながら消すエフェクト
         */
        function animateSelection(containerId, cardSelector, selectedIndex, callback) {
            const container = document.getElementById(containerId);
            const cards = container.querySelectorAll(cardSelector);
            if (!cards || cards.length < 2) {
                if(callback) callback();
                return;
            }

            const selectedCard = cards[selectedIndex];
            const unselectedCard = cards[selectedIndex === 0 ? 1 : 0];

            unselectedCard.style.transition = "opacity 0.4s ease, transform 0.4s ease";
            unselectedCard.style.opacity = "0";
            unselectedCard.style.transform = "scale(0.8)";

            const rect = selectedCard.getBoundingClientRect();
            const cardCenterX = rect.left + rect.width / 2;
            const cardCenterY = rect.top + rect.height / 2;
            const screenCenterX = window.innerWidth / 2;
            const screenCenterY = window.innerHeight / 2;

            const moveX = screenCenterX - cardCenterX;
            const moveY = screenCenterY - cardCenterY;

            selectedCard.style.transition = "transform 0.5s cubic-bezier(0.25, 1, 0.5, 1), border-color 0.3s, background-color 0.3s, box-shadow 0.3s";
            selectedCard.style.transform = `translate(${moveX}px, ${moveY}px) scale(1.2)`;
            selectedCard.style.borderColor = "#ffd700";
            selectedCard.style.backgroundColor = "rgba(255, 255, 255, 0.35)";
            selectedCard.style.boxShadow = "0 0 3vh rgba(255, 215, 0, 0.8)";
            selectedCard.style.zIndex = "20";

            setTimeout(() => {
                if(callback) callback();
            }, 1200);
        }

        /**
         * アニメーションで付与されたカードのインラインスタイルを初期化する
         */
        function resetCardStyles() {
            const allCards = document.querySelectorAll(".select-card, .quiz-option-card");
            allCards.forEach(card => {
                card.style.transition = "";
                card.style.opacity = "";
                card.style.transform = "";
                card.style.zIndex = "";
                card.style.borderColor = "";
                card.style.backgroundColor = "";
                card.style.boxShadow = "";
            });
        }

        /**
         * 選択肢エリアの描画（拡張子判定によりテキスト／画像を分岐）
         */
        function renderOptionContent(containerElem, value) {
            const imageExtensions = /\.(jpg|jpeg|png|gif|webp|svg)$/i;
            containerElem.innerHTML = "";
            if (imageExtensions.test(value)) {
                const img = document.createElement("img");
                img.src = `media/${value}`;
                img.alt = "選択肢画像";
                img.className = "option-img";
                containerElem.appendChild(img);
            } else {
                containerElem.textContent = value;
            }
        }

        /**
         * 現在の進捗・ジャンル・難易度に合わせて問題データを抽出・読み込み
         */
        function loadQuizData() {
            const currentStep = questionCount + 1;
            const matchingQuestions = questionDatabase.filter(q =>
                q.genre === selectedGenre &&
                q.difficulty === selectedDifficulty &&
                q.step === currentStep
            );

            if (matchingQuestions.length > 0) {
                const randomIndex = Math.floor(Math.random() * matchingQuestions.length);
                currentQuestion = matchingQuestions[randomIndex];

                document.getElementById("quiz-text").textContent = currentQuestion.question;
                renderOptionContent(document.getElementById("opt-a-text"), currentQuestion.optionA);
                renderOptionContent(document.getElementById("opt-b-text"), currentQuestion.optionB);
            } else {
                currentQuestion = null;
                document.getElementById("quiz-text").textContent = "問題が見つかりません";
                renderOptionContent(document.getElementById("opt-a-text"), "---");
                renderOptionContent(document.getElementById("opt-b-text"), "---");
            }
        }

        /**
         * クイズ出題時のアニメーション順次実行制御
         */
        function triggerQuizSequence() {
            const qBox = document.querySelector(".quiz-question-box");
            const optsContainer = document.querySelector(".quiz-options-container");

            qBox.classList.remove("animate-pop");
            optsContainer.classList.remove("animate-fade");

            isAnimating = true;

            setTimeout(() => {
                qBox.classList.add("animate-pop");
            }, 50);

            setTimeout(() => {
                optsContainer.classList.add("animate-fade");
            }, 1550);

            setTimeout(() => {
                isAnimating = false;
            }, 2150);
        }

        /**
         * ゲーム状態（ステート）の遷移管理メイン関数
         */
        function changeState(newState) {
            resetCardStyles();

            let targetState = newState;

            // 進行状態・クイズ状態の場合はステップ数に応じてサブステートへ変換
            if (newState === GAME_STATES.PROGRESS) {
                const step = Math.min(Math.max(questionCount, 0), 5);
                targetState = GAME_STATES[`PROGRESS_${step}`];
            } else if (newState === GAME_STATES.QUESTION) {
                const step = Math.min(Math.max(questionCount, 0), 4);
                targetState = GAME_STATES[`QUESTION_${step}`];
            }

            currentState = targetState;

            document.querySelectorAll(".ui-layer").forEach(elem => elem.classList.add("hidden"));
            playMedia(targetState);

            if (targetState === GAME_STATES.TITLE) {
                document.getElementById("ui-title").classList.remove("hidden");
            } else if (targetState === GAME_STATES.GENRE) {
                document.getElementById("ui-genre").classList.remove("hidden");
            } else if (targetState === GAME_STATES.DIFFICULTY) {
                document.getElementById("ui-difficulty").classList.remove("hidden");
            } else if (targetState.startsWith("QUESTION_")) {
                loadQuizData();
                document.getElementById("ui-question").classList.remove("hidden");
                triggerQuizSequence();
            } else if (targetState === GAME_STATES.FALL) {
                document.getElementById("ui-fall").classList.remove("hidden");
            } else if (targetState === GAME_STATES.GAMEOVER) {
                document.getElementById("ui-gameover").classList.remove("hidden");
            } else if (targetState === GAME_STATES.CLEAR) {
                document.getElementById("ui-clear").classList.remove("hidden");
            }
        }

        /**
         * ユーザーの回答選択（A/B）判定処理
         */
        function handleAnswerSubmit(userChoice) {
            let isCorrect = false;

            if (!currentQuestion || !currentQuestion.answer) {
                isCorrect = true;
            } else if (userChoice.toUpperCase() === currentQuestion.answer.toUpperCase()) {
                isCorrect = true;
            }

            if (isCorrect) {
                // 正解時はカウントを進めて対応する Progress（1〜5）へ移行
                questionCount++;
                changeState(GAME_STATES.PROGRESS);
            } else {
                changeState(GAME_STATES.FALL);
            }
        }

        // ==========================================================================
        // 5. イベントリスナー（キーボード入力制御）
        // ==========================================================================
        document.addEventListener("keydown", (e) => {
            if (!isAuthenticated) return;

            // --- [ F ] キー: 全画面切り替え ---
            if (e.code === "KeyF" || e.key === "f" || e.key === "F") {
                e.preventDefault();
                toggleFullScreen();
                return;
            }

            if (isAnimating) {
                return;
            }

            // --- [ N ] キー: 進行動画のスキップ制御 ---
            if (e.code === "KeyN" || e.key === "n" || e.key === "N") {
                if (currentState.startsWith("PROGRESS_")) {
                    e.preventDefault();

                    const videoElem = document.getElementById("bg-video");
                    videoElem.pause();

                    if (currentState === GAME_STATES.PROGRESS_5) {
                        // PROGRESS_5 終了時はクリア画面へ
                        changeState(GAME_STATES.CLEAR);
                    } else {
                        // 通常進行動画終了時は現在の questionCount に対応する問題画面へ
                        changeState(GAME_STATES.QUESTION);
                    }
                    return;
                }
            }

            if (e.code === "Space" || e.code === "Enter") {
                e.preventDefault();
            } else {
                return;
            }

            const videoElem = document.getElementById("bg-video");
            if (videoElem.paused && currentMediaVideo) {
                videoElem.play().then(() => videoElem.classList.add("active")).catch(() => {});
            }

            // --- ステート別のキー操作分岐 ---
            if (currentState === GAME_STATES.TITLE) {
                if (e.code === "Enter" || e.code === "Space") {
                    questionCount = 0;
                    changeState(GAME_STATES.GENRE);
                }
            }
            else if (currentState === GAME_STATES.GENRE) {
                if (e.code === "Space") {
                    isAnimating = true;
                    animateSelection("genre-cards", ".select-card", 0, () => {
                        selectedGenre = "ジャンル A";
                        isAnimating = false;
                        changeState(GAME_STATES.DIFFICULTY);
                    });
                } else if (e.code === "Enter") {
                    isAnimating = true;
                    animateSelection("genre-cards", ".select-card", 1, () => {
                        selectedGenre = "ジャンル B";
                        isAnimating = false;
                        changeState(GAME_STATES.DIFFICULTY);
                    });
                }
            }
            else if (currentState === GAME_STATES.DIFFICULTY) {
                if (e.code === "Space") {
                    isAnimating = true;
                    animateSelection("diff-cards", ".select-card", 0, () => {
                        selectedDifficulty = "E";
                        isAnimating = false;
                        questionCount = 0;
                        changeState(GAME_STATES.PROGRESS); // PROGRESS_0 へ遷移
                    });
                } else if (e.code === "Enter") {
                    isAnimating = true;
                    animateSelection("diff-cards", ".select-card", 1, () => {
                        selectedDifficulty = "H";
                        isAnimating = false;
                        questionCount = 0;
                        changeState(GAME_STATES.PROGRESS); // PROGRESS_0 へ遷移
                    });
                }
            }
            else if (currentState.startsWith("QUESTION_")) {
                if (e.code === "Space") {
                    isAnimating = true;
                    animateSelection("quiz-options", ".quiz-option-card", 0, () => {
                        isAnimating = false;
                        handleAnswerSubmit("A");
                    });
                } else if (e.code === "Enter") {
                    isAnimating = true;
                    animateSelection("quiz-options", ".quiz-option-card", 1, () => {
                        isAnimating = false;
                        handleAnswerSubmit("B");
                    });
                }
            }
            else if (currentState === GAME_STATES.GAMEOVER || currentState === GAME_STATES.CLEAR) {
                if (e.code === "Enter" || e.code === "Space") {
                    changeState(GAME_STATES.TITLE);
                }
            }
        });

        /**
         * パスワード認証フォーム送信処理
         */
        async function handleAuthSubmit(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                e.stopPropagation();
                const inputVal = e.target.value;
                const hash = await sha256(inputVal);
                if (hash === TARGET_HASH) {
                    document.getElementById("auth-modal").classList.add("hidden");
                    
                    if (document.activeElement) {
                        document.activeElement.blur();
                    }

                    isAuthenticated = true;
                    changeState(GAME_STATES.TITLE);
                } else {
                    document.getElementById("auth-error").textContent = "パスワードが正しくありません";
                    e.target.value = "";
                }
            }
        }

        // ==========================================================================
        // 6. 初期化（DOM読み込み完了時）
        // ==========================================================================
        window.addEventListener("DOMContentLoaded", () => {
            preloadMedia();    // メディア事前読込
            fetchQuestions();  // スプレッドシート問題取得
            changeState(GAME_STATES.TITLE);

            // 背景動画の再生完了（ended）に伴うステート自動遷移イベント
            const videoElem = document.getElementById("bg-video");
            videoElem.addEventListener("ended", () => {
                if (currentState.startsWith("PROGRESS_")) {
                    if (currentState === GAME_STATES.PROGRESS_5) {
                        // 最終進行動画（PROGRESS_5）終了後はクリア画面へ移行
                        changeState(GAME_STATES.CLEAR);
                    } else {
                        // PROGRESS_0〜4 終了後は対応する問題画面へ移行
                        changeState(GAME_STATES.QUESTION);
                    }
                } else if (currentState === GAME_STATES.FALL) {
                    changeState(GAME_STATES.GAMEOVER);
                }
            });

            const passInput = document.getElementById("pass-input");
            if (passInput) passInput.focus();
        });
    </script>
</head>
<body>
    <div id="auth-modal">
        <div class="auth-box">
            <h2>認証が必要です</h2>
            <input type="password" id="pass-input" class="auth-input" placeholder="パスワードを入力" onkeydown="handleAuthSubmit(event)">
            <div id="auth-error" class="auth-error"></div>
        </div>
    </div>

    <div class="bg-container">
        <img id="bg-img" class="bg-media" src="" alt="背景画像">
        <video id="bg-video" class="bg-media" autoplay muted playsinline></video>
    </div>

    <div id="ui-title" class="ui-layer hidden">
        <p class="fullscreen-guide">[ F ]: 全画面表示</p>
        <h1 class="title">Title!!</h1>
        <p class="start-msg">PRESS ENTER TO START</p>
    </div>

    <div id="ui-genre" class="ui-layer hidden">
        <h2 class="section-title">SELECT GENRE</h2>
        <div id="genre-cards" class="card-container">
            <div class="select-card">A</div>
            <div class="select-card">B</div>
        </div>
        <p class="key-guide">[ SPACE ]: 左を選択 / [ ENTER ]: 右を選択</p>
    </div>

    <div id="ui-difficulty" class="ui-layer hidden">
        <h2 class="section-title">SELECT DIFFICULTY</h2>
        <div id="diff-cards" class="card-container">
            <div class="select-card">EASY</div>
            <div class="select-card">HARD</div>
        </div>
        <p class="key-guide">[ SPACE ]: 左を選択 / [ ENTER ]: 右を選択</p>
    </div>

    <div id="ui-question" class="ui-layer hidden">
        <div class="quiz-container">
            <div class="quiz-question-box">
                <span id="quiz-text">問題文を取得中...</span>
            </div>

            <div id="quiz-options" class="quiz-options-container">
                <div class="quiz-option-card">
                    <span class="option-label">A [ SPACE ]</span>
                    <span id="opt-a-text" class="option-text">選択肢 A</span>
                </div>
                <div class="quiz-option-card">
                    <span class="option-label">B [ ENTER ]</span>
                    <span id="opt-b-text" class="option-text">選択肢 B</span>
                </div>
            </div>
        </div>
    </div>

    <div id="ui-fall" class="ui-layer hidden">
    </div>

    <div id="ui-gameover" class="ui-layer hidden">
        <h1 class="gameover-title">GAME OVER</h1>
        <p class="start-msg">PRESS ENTER TO TITLE</p>
    </div>

    <div id="ui-clear" class="ui-layer hidden">
        <h1 class="clear-title">CLEARED</h1>
    </div>
</body>
</html>
