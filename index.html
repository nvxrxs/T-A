<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>トロッコアドベンチャー</title>

    <!-- 0. 認証前の画面隠しCSS -->
    <style id="auth-style">
        body { display: none !important; }
    </style>

    <!-- 1. 画面デザイン・スタイル設定 (CSS) -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
            cursor: none;
        }

        /* 背景メディアエリア */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #bg-img { z-index: 1; }
        #bg-video { z-index: 2; }

        .hidden { display: none !important; }

        /* 共通UIレイヤー */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
        }

        /* タイトル画面UI */
        .title {
            font-size: 3.5rem;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        .start-msg {
            font-size: 1.5rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* 選択画面共通UI */
        .section-title {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
        }

        .card-container {
            display: flex;
            gap: 4rem;
        }

        .select-card {
            width: 260px;
            height: 260px;
            background: rgba(0, 0, 0, 0.6);
            border: 4px solid #fff;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            transition: transform 0.15s, background-color 0.15s, border-color 0.15s;
        }

        /* 物理ボタンで選択中のスタイル（ホバー効果は廃止） */
        .select-card.selected {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8);
        }

        .key-guide {
            margin-top: 3rem;
            font-size: 1.1rem;
            color: #ccc;
        }
    </style>

    <!-- 2. ゲームロジック・進行管理 (JavaScript) -->
    <script>
        const GAME_STATES = {
            TITLE: "TITLE",
            GENRE: "GENRE",
            DIFFICULTY: "DIFFICULTY",
            PROGRESS: "PROGRESS",
            QUESTION: "QUESTION",
            FALL: "FALL",
            GAMEOVER: "GAMEOVER",
            CLEAR: "CLEAR"
        };

        const MEDIA_PATHS = {
            [GAME_STATES.TITLE]:      { video: "media/bg-title.mp4", poster: "media/bg-title.PNG" },
            [GAME_STATES.GENRE]:      { video: "media/bg-title.mp4", poster: "media/bg-title.PNG" },
            [GAME_STATES.DIFFICULTY]: { video: "media/bg-title.mp4", poster: "media/bg-title.PNG" },
            [GAME_STATES.PROGRESS]:   { video: "media/bg-progress.mp4", poster: "media/bg-progress.JPG" },
            [GAME_STATES.QUESTION]:   { video: "media/bg-quiz.mp4", poster: "media/bg-quiz.JPG" },
            [GAME_STATES.FALL]:       { video: "media/bg-fall.mp4", poster: "media/bg-fall.JPG" },
            [GAME_STATES.GAMEOVER]:   { video: "media/bg-gameover.mp4", poster: "media/bg-gameover.JPG" },
            [GAME_STATES.CLEAR]:      { video: "media/bg-clear.mp4", poster: "media/bg-clear.JPG" }
        };

        let currentState = GAME_STATES.TITLE;
        let selectedIndex = 0;
        let currentMediaVideo = null;

        let selectedGenre = "";
        let selectedDifficulty = "";

        const TARGET_HASH = "5817ae4948371f9b6b7d94615c0704e6a13ba5a773938351ebd832d0fcdbdf2f";

        async function sha256(str) {
            const buff = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buff))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        function revealPage() {
            const styleTag = document.getElementById("auth-style");
            if (styleTag) styleTag.remove();
            initApp();
        }

        // --- メディア制御（背景黒化防止処理追加） ---
        function playMedia(stateKey) {
            const media = MEDIA_PATHS[stateKey];
            if (!media) return;

            // 動画パスが変わらない場合は再読み込みせずループ継続
            if (currentMediaVideo === media.video && media.video !== "") {
                return;
            }
            currentMediaVideo = media.video;

            const imgElem = document.getElementById("bg-img");
            const videoElem = document.getElementById("bg-video");

            // 静止画を設定（動画が再生できなくても黒画面にならないよう常時表示）
            if (media.poster) {
                imgElem.src = media.poster;
                imgElem.classList.remove("hidden");
            }

            if (media.video) {
                videoElem.src = media.video;
                videoElem.load();
                
                const playPromise = videoElem.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        videoElem.classList.remove("hidden");
                    }).catch((err) => {
                        console.warn("Video play failed, fallback to image:", err);
                        videoElem.classList.add("hidden");
                    });
                }
            } else {
                videoElem.classList.add("hidden");
            }
        }

        function updateCardFocus(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const cards = container.querySelectorAll(".select-card");
            cards.forEach((card, idx) => {
                if (idx === selectedIndex) {
                    card.classList.add("selected");
                } else {
                    card.classList.remove("selected");
                }
            });
        }

        function changeState(newState) {
            currentState = newState;
            selectedIndex = 0;

            document.querySelectorAll(".ui-layer").forEach(elem => elem.classList.add("hidden"));
            playMedia(newState);

            if (newState === GAME_STATES.TITLE) {
                document.getElementById("ui-title").classList.remove("hidden");
            } else if (newState === GAME_STATES.GENRE) {
                document.getElementById("ui-genre").classList.remove("hidden");
                updateCardFocus("genre-cards");
            } else if (newState === GAME_STATES.DIFFICULTY) {
                document.getElementById("ui-difficulty").classList.remove("hidden");
                updateCardFocus("diff-cards");
            }
        }

        // --- 物理ボタン2つ専用の入力制御 ---
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "Enter") {
                e.preventDefault();
            } else {
                return;
            }

            if (currentState === GAME_STATES.TITLE) {
                if (e.code === "Enter" || e.code === "Space") {
                    changeState(GAME_STATES.GENRE);
                }
            } else if (currentState === GAME_STATES.GENRE) {
                if (e.code === "Space") {
                    selectedIndex = (selectedIndex === 0) ? 1 : 0;
                    updateCardFocus("genre-cards");
                } else if (e.code === "Enter") {
                    selectedGenre = selectedIndex === 0 ? "ジャンル A" : "ジャンル B";
                    console.log("決定ジャンル:", selectedGenre);
                    changeState(GAME_STATES.DIFFICULTY);
                }
            } else if (currentState === GAME_STATES.DIFFICULTY) {
                if (e.code === "Space") {
                    selectedIndex = (selectedIndex === 0) ? 1 : 0;
                    updateCardFocus("diff-cards");
                } else if (e.code === "Enter") {
                    selectedDifficulty = selectedIndex === 0 ? "初級" : "上級";
                    console.log("決定難易度:", selectedDifficulty);
                }
            }
        });

        function initApp() {
            playMedia(GAME_STATES.TITLE);
            window.focus();
        }

        (async function checkAuth() {
            while (true) {
                const userInput = prompt("Enter password:");
                if (userInput === null) {
                    alert("Authentication canceled");
                    window.location.href = "about:blank";
                    return;
                }
                const inputHash = await sha256(userInput);
                if (inputHash === TARGET_HASH) {
                    revealPage();
                    return;
                }
                alert("Incorrect password");
            }
        })();
    </script>
</head>
<body>

    <!-- 背景メディア領域 -->
    <div class="bg-container">
        <img id="bg-img" class="bg-media" src="" alt="背景画像">
        <video id="bg-video" class="bg-media hidden" autoplay loop muted playsinline></video>
    </div>

    <!-- ① タイトル画面UI -->
    <div id="ui-title" class="ui-layer">
        <h1 class="title">Title!!</h1>
        <p class="start-msg">PRESS ENTER TO START</p>
    </div>

    <!-- ② ジャンル選択UI -->
    <div id="ui-genre" class="ui-layer hidden">
        <h2 class="section-title">SELECT GENRE</h2>
        <div id="genre-cards" class="card-container">
            <div class="select-card">ジャンル A</div>
            <div class="select-card">ジャンル B</div>
        </div>
        <p class="key-guide">[ SPACE ]: 選択移動 / [ ENTER ]: 決定</p>
    </div>

    <!-- ③ 難易度選択UI -->
    <div id="ui-difficulty" class="ui-layer hidden">
        <h2 class="section-title">SELECT DIFFICULTY</h2>
        <div id="diff-cards" class="card-container">
            <div class="select-card">初 級</div>
            <div class="select-card">上 級</div>
        </div>
        <p class="key-guide">[ SPACE ]: 選択移動 / [ ENTER ]: 決定</p>
    </div>

</body>
</html>
