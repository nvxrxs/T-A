<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>トロッコアドベンチャー</title>

    <!-- ==========================================
      0. 認証前の画面隠しCSS
    =========================================== -->
    <style id="auth-style">
        body { display: none !important; }
    </style>

    <!-- ==========================================
      1. 画面デザイン・スタイル設定 (CSS)
    =========================================== -->
    <style>
        /* 共通基本設定 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* スクロール禁止 */
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }

        /* ─── 背景メディア領域 ─── */
        .bg-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        .bg-media {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        /* ─── UI表示レイヤー（共通） ─── */
        .ui-layer {
            position: relative;
            z-index: 2;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
        }

        /* 非表示用クラス */
        .hidden {
            display: none !important;
        }

        /* --- [UI 1] タイトル画面 --- */
        .title {
            font-size: 3.5rem;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }
        .start-msg {
            font-size: 1.5rem;
            animation: blink 1.5s infinite;
        }

        /* --- [UI 2] クイズ出題画面 --- */
        .quiz-container {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 80%;
        }
        .question-text {
            font-size: 2rem;
            margin-bottom: 30px;
        }
        .options-container {
            display: flex;
            gap: 40px;
            justify-content: center;
        }
        .option-box {
            border: 3px solid #fff;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.5rem;
            background: rgba(0, 0, 0, 0.4);
        }

        /* --- アニメーション --- */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
    </style>

    <!-- ==========================================
      2. ゲームロジック・進行管理 (JavaScript)
    =========================================== -->
    <script>
        // --------------------------------------------------
        // A. パスワード認証設定
        // --------------------------------------------------
        const TARGET_HASH = "5817ae4948371f9b6b7d94615c0704e6a13ba5a773938351ebd832d0fcdbdf2f";

        async function sha256(str) {
            const buff = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buff))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        function revealPage() {
            const styleTag = document.getElementById("auth-style");
            if (styleTag) styleTag.remove();
        }

        (async function checkAuth() {
            while (true) {
                const userInput = prompt("Enter password:");
                if (userInput === null) {
                    alert("Authentication canceled");
                    window.location.href = "about:blank";
                    return;
                }
                const inputHash = await sha256(userInput);
                if (inputHash === TARGET_HASH) {
                    if (document.readyState === "loading") {
                        document.addEventListener("DOMContentLoaded", revealPage);
                    } else {
                        revealPage();
                    }
                    return;
                }
                alert("Incorrect password");
            }
        })();


        // --------------------------------------------------
        // B. 動画・画像素材の一括管理テーブル
        // ※後で動画を用意した際、ここを書き換えるだけで適用されます
        // --------------------------------------------------
        const MEDIA_PATHS = {
            TITLE:            { video: "media/bg-title.mp4", poster: "media/bg-title.JPG" },
            STAGE_1_MOVING:  { video: "media/stage1-move.mp4", poster: "media/stage1-move.JPG" },
            STAGE_1_QUESTION:{ video: "media/stage1-quiz.mp4", poster: "media/stage1-quiz.JPG" },
            GAMEOVER_FALL:   { video: "media/gameover-fall.mp4", poster: "media/gameover-fall.JPG" },
            CLEAR:           { video: "media/clear.mp4", poster: "media/clear.JPG" }
        };


        // --------------------------------------------------
        // C. ゲーム進行状態（ステート管理）
        // --------------------------------------------------
        const GAME_STATES = {
            TITLE: "TITLE",                     // タイトル画面
            STAGE_1_MOVING: "STAGE_1_MOVING",   // 1曲目/1問目へ移動中（動画）
            STAGE_1_QUIZ: "STAGE_1_QUIZ",       // 1問目出題中・キー入力待ち
            GAMEOVER: "GAMEOVER",               // 落下・ゲームオーバー
            CLEAR: "CLEAR"                      // 成功・クリア
        };

        // 初期状態
        let currentState = GAME_STATES.TITLE;


        // --------------------------------------------------
        // D. 画面切り替え処理関数
        // --------------------------------------------------
        function changeState(newState) {
            currentState = newState;
            console.log("現在の状態:", currentState);

            const videoElem = document.getElementById("bg-video");
            const titleUI = document.getElementById("ui-title");
            const quizUI = document.getElementById("ui-quiz");

            // 全UIを一度非表示にする
            titleUI.classList.add("hidden");
            quizUI.classList.add("hidden");

            // --- 状態ごとに動画とUIを更新 ---
            switch (currentState) {
                case GAME_STATES.TITLE:
                    setMedia(videoElem, MEDIA_PATHS.TITLE);
                    titleUI.classList.remove("hidden");
                    break;

                case GAME_STATES.STAGE_1_MOVING:
                    setMedia(videoElem, MEDIA_PATHS.STAGE_1_MOVING);
                    // 移動演出動画が終わったら自動で問題表示へ移行させる例
                    setTimeout(() => {
                        changeState(GAME_STATES.STAGE_1_QUIZ);
                    }, 5000); // ※仮で5秒後に問題画面に遷移
                    break;

                case GAME_STATES.STAGE_1_QUIZ:
                    setMedia(videoElem, MEDIA_PATHS.STAGE_1_QUESTION);
                    quizUI.classList.remove("hidden");
                    break;

                case GAME_STATES.GAMEOVER:
                    setMedia(videoElem, MEDIA_PATHS.GAMEOVER_FALL);
                    break;

                case GAME_STATES.CLEAR:
                    setMedia(videoElem, MEDIA_PATHS.CLEAR);
                    break;
            }
        }

        // 背景メディア切り替え補助関数
        function setMedia(videoElem, mediaObj) {
            videoElem.poster = mediaObj.poster;
            const sourceElem = videoElem.querySelector("source");
            sourceElem.src = mediaObj.video;
            videoElem.load();
            videoElem.play().catch(() => {}); // 自動再生時のブラウザエラー防止
        }


        // --------------------------------------------------
        // E. 物理ボタン（キー入力）制御
        // --------------------------------------------------
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault(); // スクロール防止
            }

            // --- 1. タイトル画面での操作 ---
            if (currentState === GAME_STATES.TITLE) {
                if (e.code === "Enter" || e.code === "Space") {
                    console.log("ゲーム開始 -> STAGE 1 へ移動");
                    changeState(GAME_STATES.STAGE_1_MOVING);
                }
            }

            // --- 2. クイズ出題中での操作（左＝Enter / 右＝Space） ---
            else if (currentState === GAME_STATES.STAGE_1_QUIZ) {
                if (e.code === "Enter") {
                    console.log("左を選択（Enter）");
                    // 正解判定処理など
                    changeState(GAME_STATES.CLEAR);
                } else if (e.code === "Space") {
                    console.log("右を選択（Space）");
                    // 不正解判定処理など
                    changeState(GAME_STATES.GAMEOVER);
                }
            }
        });
    </script>
</head>
<body>

    <!-- ==========================================
      3. 背景メディアコンテナ (DOM)
    =========================================== -->
    <div class="bg-container">
        <video id="bg-video" class="bg-media" autoplay loop muted playsinline poster="media/bg-title.JPG">
            <source src="" type="video/mp4">
        </video>
    </div>

    <!-- ==========================================
      4. 各画面のUIレイヤー (DOM)
    =========================================== -->

    <!-- [UI 1] タイトル画面レイヤー -->
    <div id="ui-title" class="ui-layer">
        <h1 class="title">トロッコアドベンチャー</h1>
        <p class="start-msg">PRESS ENTER TO START</p>
    </div>

    <!-- [UI 2] クイズ画面レイヤー（初期は hidden） -->
    <div id="ui-quiz" class="ui-layer hidden">
        <div class="quiz-container">
            <div class="question-text">Q. 日本で一番高い山は？</div>
            <div class="options-container">
                <div class="option-box">【左: Enter】<br>富士山</div>
                <div class="option-box">【右: Space】<br>高尾山</div>
            </div>
        </div>
    </div>

</body>
</html>
