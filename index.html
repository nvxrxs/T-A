<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>トロッコアドベンチャー</title>

    <!-- 画面のチラつき防止・スタイリング -->
    <style id="auth-style">
        body { display: none !important; }
    </style>
    
    <style>
        /* 画面全体の基本リセット */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* 背景映像/画像コンテナ */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 背景メディア（画面いっぱいに広げる） */
        .bg-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* UIオーバーレイレイヤー */
        .ui-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
        }

        .title {
            font-size: 3rem;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        /* 入力待機メッセージの点滅アニメーション */
        .start-msg {
            font-size: 1.5rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
    </style>

    <script>
        // パスワード
        const TARGET_HASH = "5817ae4948371f9b6b7d94615c0704e6a13ba5a773938351ebd832d0fcdbdf2f";

        // 文字列変換関数
        async function sha256(str) {
            const buff = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buff))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        // 画面非表示用CSSを削除する関数
        function revealPage() {
            const styleTag = document.getElementById("auth-style");
            if (styleTag) styleTag.remove();
        }

        // パスワード認証処理
        (async function checkAuth() {
            while (true) {
                const userInput = prompt("Enter password:");
                
                // キャンセルボタンが押された場合
                if (userInput === null) {
                    alert("Authentication canceled");
                    window.location.href = "about:blank";
                    return;
                }

                const inputHash = await sha256(userInput);
                
                if (inputHash === TARGET_HASH) {
                    // 正解：DOMが準備済みなら即削除、未完了ならイベント登録
                    if (document.readyState === "loading") {
                        document.addEventListener("DOMContentLoaded", revealPage);
                    } else {
                        revealPage();
                    }
                    return;
                }

                // 不正解の場合（再度promptへ戻る）
                alert("Incorrect password");
            }
        })();

        // キー入力待機処理（ゲーム開始などの判定用）
        document.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault(); // スクロール防止
            }
            if (e.code === "Enter" || e.code === "Space") {
                console.log("Start input detected");
            }
        });
    </script>
</head>
<body>

    <!-- 背景メディア領域 -->
    <div class="bg-container">
        <!-- 
            代用画像を使う間：poster="media/bg-title.JPG" 
            動画差し替え時：src="media/bg-title.mp4" を設定
        -->
        <video class="bg-media" autoplay loop muted playsinline poster="media/bg-title.JPG">
            <source src="" type="video/mp4">
        </video>
    </div>

    <!-- タイトルUI領域 -->
    <div class="ui-layer">
        <h1 class="title">トロッコアドベンチャー</h1>
        <p class="start-msg">PRESS ENTER TO START</p>
    </div>

</body>
</html>
