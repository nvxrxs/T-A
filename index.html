<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>トロッコアドベンチャー</title>

    <!-- 0. 認証前の画面隠しCSS -->
    <style id="auth-style">
        body { display: none !important; }
    </style>

    <!-- 1. 画面デザイン・スタイル設定 (CSS) -->
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* スクロール禁止 */
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }

        /* 背景メディアエリア */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 静止画用レイヤー */
        #bg-img {
            z-index: 1;
        }

        /* 動画用レイヤー */
        #bg-video {
            z-index: 2;
        }

        /* 非表示クラス */
        .hidden {
            display: none !important;
        }

        /* 共通UIレイヤー */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
        }

        /* タイトル画面UI */
        .title {
            font-size: 3.5rem;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        .start-msg {
            font-size: 1.5rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* ジャンル選択UI */
        .genre-title {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
        }

        .genre-container {
            display: flex;
            gap: 4rem;
        }

        .genre-box {
            width: 260px;
            height: 260px;
            background: rgba(0, 0, 0, 0.6);
            border: 4px solid #fff;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
        }

        .genre-box:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffd700;
        }
    </style>

    <!-- 2. ゲームロジック・進行管理 (JavaScript) -->
    <script>
        // --- A. フェーズ定義（状態管理） ---
        const GAME_STATES = {
            TITLE: "TITLE",           // ① Title
            GENRE: "GENRE",           // ② Genre
            DIFFICULTY: "DIFFICULTY", // ③ Difficulty
            PROGRESS: "PROGRESS",     // ④ 道中の進行
            QUESTION: "QUESTION",     // ⑤ 出題画面 / ⑥ 回答
            FALL: "FALL",             // ⑦-II 落下演出
            GAMEOVER: "GAMEOVER",     // ⑧-II Gameover
            CLEAR: "CLEAR"            // ⑧-I Clear
        };

        // --- B. メディア一括管理 ---
        const MEDIA_PATHS = {
            [GAME_STATES.TITLE]:      { video: "media/bg-title.mp4", poster: "media/bg-title.PNG" },
            [GAME_STATES.GENRE]:      { video: "media/bg-genre.mp4", poster: "media/bg-genre.JPG" },
            [GAME_STATES.DIFFICULTY]: { video: "media/bg-diff.mp4", poster: "media/bg-diff.JPG" },
            [GAME_STATES.PROGRESS]:   { video: "media/bg-progress.mp4", poster: "media/bg-progress.JPG" },
            [GAME_STATES.QUESTION]:   { video: "media/bg-quiz.mp4", poster: "media/bg-quiz.JPG" },
            [GAME_STATES.FALL]:       { video: "media/bg-fall.mp4", poster: "media/bg-fall.JPG" },
            [GAME_STATES.GAMEOVER]:   { video: "media/bg-gameover.mp4", poster: "media/bg-gameover.JPG" },
            [GAME_STATES.CLEAR]:      { video: "media/bg-clear.mp4", poster: "media/bg-clear.JPG" }
        };

        let currentState = GAME_STATES.TITLE;

        // --- C. パスワード認証 ---
        const TARGET_HASH = "5817ae4948371f9b6b7d94615c0704e6a13ba5a773938351ebd832d0fcdbdf2f";

        async function sha256(str) {
            const buff = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buff))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        function revealPage() {
            const styleTag = document.getElementById("auth-style");
            if (styleTag) styleTag.remove();
            initApp();
        }

        // --- D. メディア呼び出し関数 ---
        function playMedia(stateKey) {
            const media = MEDIA_PATHS[stateKey];
            if (!media) return;

            const imgElem = document.getElementById("bg-img");
            const videoElem = document.getElementById("bg-video");
            const sourceElem = document.getElementById("bg-source");

            imgElem.src = media.poster;

            if (media.video) {
                sourceElem.src = media.video;
                videoElem.load();
                
                const playPromise = videoElem.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        videoElem.classList.remove("hidden");
                    }).catch(() => {
                        videoElem.classList.add("hidden");
                    });
                }
            } else {
                videoElem.classList.add("hidden");
            }
        }

        // --- E. 画面遷移処理 ---
        function changeState(newState) {
            currentState = newState;

            document.querySelectorAll(".ui-layer").forEach(elem => elem.classList.add("hidden"));
            playMedia(newState);

            if (newState === GAME_STATES.TITLE) {
                document.getElementById("ui-title").classList.remove("hidden");
            } else if (newState === GAME_STATES.GENRE) {
                document.getElementById("ui-genre").classList.remove("hidden");
            }
        }

        // --- F. 初期化およびイベント管理 ---
        function initApp() {
            playMedia(GAME_STATES.TITLE);
            window.focus(); // 画面にフォーカスを当てる
        }

        // グローバルでのキー検出（DOMContentLoadedや認証のタイマーに依存しない）
        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.code === "Space") {
                e.preventDefault();
                if (currentState === GAME_STATES.TITLE) {
                    changeState(GAME_STATES.GENRE);
                }
            }
        });

        // 画面クリック時にもタイトル画面から遷移可能（フォーカス復帰用）
        document.addEventListener("click", () => {
            if (currentState === GAME_STATES.TITLE) {
                changeState(GAME_STATES.GENRE);
            }
        });

        // 認証処理の起動
        (async function checkAuth() {
            while (true) {
                const userInput = prompt("Enter password:");
                if (userInput === null) {
                    alert("Authentication canceled");
                    window.location.href = "about:blank";
                    return;
                }
                const inputHash = await sha256(userInput);
                if (inputHash === TARGET_HASH) {
                    revealPage();
                    return;
                }
                alert("Incorrect password");
            }
        })();

        function selectGenre(genreName) {
            console.log("ジャンル選択:", genreName);
        }
    </script>
</head>
<body>

    <!-- 背景メディア領域 -->
    <div class="bg-container">
        <img id="bg-img" class="bg-media" src="" alt="背景画像">
        <video id="bg-video" class="bg-media hidden" autoplay loop muted playsinline>
            <source id="bg-source" src="" type="video/mp4">
        </video>
    </div>

    <!-- ① タイトル画面UI（入力待機） -->
    <div id="ui-title" class="ui-layer">
        <h1 class="title">Title!!</h1>
        <p class="start-msg">PRESS ENTER TO START</p>
    </div>

    <!-- ② ジャンル選択UI -->
    <div id="ui-genre" class="ui-layer hidden">
        <h2 class="genre-title">SELECT GENRE</h2>
        <div class="genre-container">
            <div class="genre-box" onclick="selectGenre('ジャンルA')">ジャンル A</div>
            <div class="genre-box" onclick="selectGenre('ジャンルB')">ジャンル B</div>
        </div>
    </div>

</body>
</html>
