<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>トロッコアドベンチャー</title>

    <style>
        /* 画面全体の基本設定 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
            cursor: none;
        }

        /* 背景メディア（画像・動画）配置コンテナ */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .bg-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #bg-img {
            z-index: 1;
            display: block;
        }

        #bg-video {
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #bg-video.active {
            opacity: 1;
        }

        .hidden { display: none !important; }

        /* パスワード認証モーダル（固定pxサイズ） */
        #auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            background: #222;
            width: 100px; /* ボックス幅調整箇所 */
            padding: 10px; /* 余白調整箇所 */
            border-radius: 20px;
            border: 3px solid #555;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            box-sizing: border-box;
        }

        .auth-box h2 {
            font-size: 6px; /* 見出し文字サイズ調整箇所 */
            margin: 0 0 20px 0;
            color: #fff;
            text-shadow: none;
        }

        .auth-input {
            width: 100%;
            font-size: 5px; /* 入力文字サイズ調整箇所 */
            padding: 2.5px 4px; /* 入力枠余白調整箇所 */
            border-radius: 8px;
            border: 2px solid #ccc;
            text-align: center;
            outline: none;
            box-sizing: border-box;
        }

        .auth-error {
            color: #ff4d4d;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            text-shadow: none;
        }

        /* 共通UIレイヤー */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 2vh 2vw;
            text-shadow: 0 0.4vh 1.5vh rgba(0, 0, 0, 0.95);
        }

        /* タイトル画面UI */
        .title {
            font-size: 12vh;
            margin-bottom: 4vh;
            letter-spacing: 0.1em;
            font-weight: 900;
        }

        .start-msg {
            font-size: 4vh;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }

        .fullscreen-guide {
            margin-top: 2vh;
            font-size: 2.5vh;
            color: #aaa;
            font-weight: bold;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* 選択画面共通UI */
        .section-title {
            font-size: 8vh;
            margin-bottom: 4vh;
            letter-spacing: 0.05em;
            font-weight: bold;
        }

        .card-container {
            display: flex;
            gap: 4vw;
            justify-content: center;
            align-items: center;
            max-width: 90vw;
        }

        /* 選択可能カード */
        .select-card {
            width: 32vh;
            height: 32vh;
            max-width: 40vw;
            max-height: 40vw;
            background: rgba(0, 0, 0, 0.65);
            border: 0.8vh solid #fff;
            border-radius: 3vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8vh;
            font-weight: bold;
            box-shadow: 0 1vh 2.5vh rgba(0, 0, 0, 0.9);
            transition: transform 0.15s, background-color 0.15s, border-color 0.15s;
            box-sizing: border-box;
        }

        .select-card.selected {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.35);
            border-color: #ffd700;
            box-shadow: 0 0 3vh rgba(255, 215, 0, 0.6);
        }

        .key-guide {
            margin-top: 5vh;
            font-size: 3vh;
            font-weight: bold;
            color: #eee;
        }
    </style>

    <script>
        const GAME_STATES = {
            TITLE: "TITLE",
            GENRE: "GENRE",
            DIFFICULTY: "DIFFICULTY",
            PROGRESS: "PROGRESS",
            QUESTION: "QUESTION",
            FALL: "FALL",
            GAMEOVER: "GAMEOVER",
            CLEAR: "CLEAR"
        };

        const MEDIA_PATHS = {
            [GAME_STATES.TITLE]:      { video: "media/bg-title.mp4", poster: "media/bg-title.PNG" },
            [GAME_STATES.GENRE]:      { video: "media/bg-title.mp4", poster: "media/bg-title.PNG" },
            [GAME_STATES.DIFFICULTY]: { video: "media/bg-title.mp4", poster: "media/bg-title.PNG" },
            [GAME_STATES.PROGRESS]:   { video: "media/bg-progress.mp4", poster: "media/bg-progress.JPG" },
            [GAME_STATES.QUESTION]:   { video: "media/bg-quiz.mp4", poster: "media/bg-quiz.JPG" },
            [GAME_STATES.FALL]:       { video: "media/bg-fall.mp4", poster: "media/bg-fall.JPG" },
            [GAME_STATES.GAMEOVER]:   { video: "media/bg-gameover.mp4", poster: "media/bg-gameover.JPG" },
            [GAME_STATES.CLEAR]:      { video: "media/bg-clear.mp4", poster: "media/bg-clear.JPG" }
        };

        let currentState = GAME_STATES.TITLE;
        let selectedIndex = 0;
        let currentMediaVideo = null;
        let isAuthenticated = false;

        let selectedGenre = "";
        let selectedDifficulty = "";

        const TARGET_HASH = "5817ae4948371f9b6b7d94615c0704e6a13ba5a773938351ebd832d0fcdbdf2f";

        /**
         * 全画面表示の切り替え処理
         */
        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(() => {});
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        async function sha256(str) {
            const buff = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buff))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        function playMedia(stateKey) {
            const media = MEDIA_PATHS[stateKey];
            if (!media) return;

            const imgElem = document.getElementById("bg-img");
            const videoElem = document.getElementById("bg-video");

            if (media.poster) {
                imgElem.src = media.poster;
            }

            if (currentMediaVideo === media.video && media.video !== "") {
                return;
            }
            currentMediaVideo = media.video;

            if (media.video) {
                videoElem.src = media.video;
                videoElem.load();
                
                const playPromise = videoElem.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        videoElem.classList.add("active");
                    }).catch(() => {
                        videoElem.classList.remove("active");
                    });
                }
            } else {
                videoElem.classList.remove("active");
            }
        }

        function updateCardFocus(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const cards = container.querySelectorAll(".select-card");
            cards.forEach((card, idx) => {
                if (idx === selectedIndex) {
                    card.classList.add("selected");
                } else {
                    card.classList.remove("selected");
                }
            });
        }

        function changeState(newState) {
            currentState = newState;
            selectedIndex = 0;

            document.querySelectorAll(".ui-layer").forEach(elem => elem.classList.add("hidden"));
            
            playMedia(newState);

            if (newState === GAME_STATES.TITLE) {
                document.getElementById("ui-title").classList.remove("hidden");
            } else if (newState === GAME_STATES.GENRE) {
                document.getElementById("ui-genre").classList.remove("hidden");
                updateCardFocus("genre-cards");
            } else if (newState === GAME_STATES.DIFFICULTY) {
                document.getElementById("ui-difficulty").classList.remove("hidden");
                updateCardFocus("diff-cards");
            }
        }

        document.addEventListener("keydown", (e) => {
            if (!isAuthenticated) return;

            // Fキー押下時の全画面切替（タイトル画面限定）
            if (currentState === GAME_STATES.TITLE && (e.code === "KeyF" || e.key === "f" || e.key === "F")) {
                e.preventDefault();
                toggleFullScreen();
                return;
            }

            if (e.code === "Space" || e.code === "Enter") {
                e.preventDefault();
            } else {
                return;
            }

            const videoElem = document.getElementById("bg-video");
            if (videoElem.paused && currentMediaVideo) {
                videoElem.play().then(() => videoElem.classList.add("active")).catch(() => {});
            }

            if (currentState === GAME_STATES.TITLE) {
                if (e.code === "Enter" || e.code === "Space") {
                    changeState(GAME_STATES.GENRE);
                }
            } 
            else if (currentState === GAME_STATES.GENRE) {
                if (e.code === "Space") {
                    selectedIndex = (selectedIndex === 0) ? 1 : 0;
                    updateCardFocus("genre-cards");
                } else if (e.code === "Enter") {
                    selectedGenre = selectedIndex === 0 ? "ジャンル A" : "ジャンル B";
                    changeState(GAME_STATES.DIFFICULTY);
                }
            } 
            else if (currentState === GAME_STATES.DIFFICULTY) {
                if (e.code === "Space") {
                    selectedIndex = (selectedIndex === 0) ? 1 : 0;
                    updateCardFocus("diff-cards");
                } else if (e.code === "Enter") {
                    selectedDifficulty = selectedIndex === 0 ? "初級" : "上級";
                }
            }
        });

        async function handleAuthSubmit(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                e.stopPropagation();

                const inputVal = e.target.value;
                const hash = await sha256(inputVal);

                if (hash === TARGET_HASH) {
                    document.getElementById("auth-modal").classList.add("hidden");
                    changeState(GAME_STATES.TITLE);

                    setTimeout(() => {
                        isAuthenticated = true;
                    }, 50);
                } else {
                    document.getElementById("auth-error").textContent = "パスワードが正しくありません";
                    e.target.value = "";
                }
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            playMedia(GAME_STATES.TITLE);
            const passInput = document.getElementById("pass-input");
            if (passInput) passInput.focus();
        });
    </script>
</head>
<body>

    <!-- パスワード認証モーダル画面 -->
    <div id="auth-modal">
        <div class="auth-box">
            <h2>認証が必要です</h2>
            <input type="password" id="pass-input" class="auth-input" placeholder="パスワードを入力" onkeydown="handleAuthSubmit(event)">
            <div id="auth-error" class="auth-error"></div>
        </div>
    </div>

    <!-- 背景描画コンテナ -->
    <div class="bg-container">
        <img id="bg-img" class="bg-media" src="" alt="背景画像">
        <video id="bg-video" class="bg-media" autoplay loop muted playsinline></video>
    </div>

    <!-- タイトル画面 UI -->
    <div id="ui-title" class="ui-layer hidden">
        <h1 class="title">Title!!</h1>
        <p class="start-msg">PRESS ENTER TO START</p>
        <p class="fullscreen-guide">[ F ]: 全画面表示 切替</p>
    </div>

    <!-- ジャンル選択画面 UI -->
    <div id="ui-genre" class="ui-layer hidden">
        <h2 class="section-title">SELECT GENRE</h2>
        <div id="genre-cards" class="card-container">
            <div class="select-card">A</div>
            <div class="select-card">B</div>
        </div>
        <p class="key-guide">[ SPACE ]: 選択移動 / [ ENTER ]: 決定</p>
    </div>

    <!-- 難易度選択画面 UI -->
    <div id="ui-difficulty" class="ui-layer hidden">
        <h2 class="section-title">SELECT DIFFICULTY</h2>
        <div id="diff-cards" class="card-container">
            <div class="select-card">EASY</div>
            <div class="select-card">HARD</div>
        </div>
        <p class="key-guide">[ SPACE ]: 選択移動 / [ ENTER ]: 決定</p>
    </div>

</body>
</html>
