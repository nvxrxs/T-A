<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>トロッコアドベンチャー</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
            cursor: none;
        }

        /* 背景エリア */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .bg-media {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #bg-img {
            z-index: 1;
            display: block;
        }

        #bg-video {
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #bg-video.active {
            opacity: 1;
        }

        .hidden { display: none !important; }

        /* 共通UIレイヤー */
        .ui-layer {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9);
        }

        /* パスワード認証モーダル */
        #auth-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            background: #222;
            padding: 2rem 3rem;
            border-radius: 12px;
            border: 2px solid #555;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }

        .auth-input {
            font-size: 1.5rem;
            padding: 0.5rem 1rem;
            margin-top: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            text-align: center;
            outline: none;
        }

        .auth-error {
            color: #ff4d4d;
            margin-top: 1rem;
            font-size: 1rem;
        }

        /* タイトル画面UI */
        .title {
            font-size: 3.5rem;
            margin-bottom: 2rem;
            letter-spacing: 0.1em;
        }

        .start-msg {
            font-size: 1.5rem;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* 選択画面共通UI */
        .section-title {
            font-size: 2.5rem;
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
        }

        .card-container {
            display: flex;
            gap: 4rem;
        }

        .select-card {
            width: 260px;
            height: 260px;
            background: rgba(0, 0, 0, 0.6);
            border: 4px solid #fff;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.8);
            transition: transform 0.15s, background-color 0.15s, border-color 0.15s;
        }

        .select-card.selected {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffd700;
        }

        .key-guide {
            margin-top: 3rem;
            font-size: 1.1rem;
            color: #ccc;
        }
    </style>

    <script>
        const GAME_STATES = {
            TITLE: "TITLE",
            GENRE: "GENRE",
            DIFFICULTY: "DIFFICULTY",
            PROGRESS: "PROGRESS",
            QUESTION: "QUESTION",
            FALL: "FALL",
            GAMEOVER: "GAMEOVER",
            CLEAR: "CLEAR"
        };

        const MEDIA_PATHS = {
            [GAME_STATES.TITLE]:      { video: "media/bg-title.mp4", poster: "media/bg-title.PNG" },
            [GAME_STATES.GENRE]:      { video: "media/bg-title.mp4", poster: "media/bg-title.PNG" },
            [GAME_STATES.DIFFICULTY]: { video: "media/bg-title.mp4", poster: "media/bg-title.PNG" },
            [GAME_STATES.PROGRESS]:   { video: "media/bg-progress.mp4", poster: "media/bg-progress.JPG" },
            [GAME_STATES.QUESTION]:   { video: "media/bg-quiz.mp4", poster: "media/bg-quiz.JPG" },
            [GAME_STATES.FALL]:       { video: "media/bg-fall.mp4", poster: "media/bg-fall.JPG" },
            [GAME_STATES.GAMEOVER]:   { video: "media/bg-gameover.mp4", poster: "media/bg-gameover.JPG" },
            [GAME_STATES.CLEAR]:      { video: "media/bg-clear.mp4", poster: "media/bg-clear.JPG" }
        };

        let currentState = GAME_STATES.TITLE;
        let selectedIndex = 0;
        let currentMediaVideo = null;
        let isAuthenticated = false;

        let selectedGenre = "";
        let selectedDifficulty = "";

        const TARGET_HASH = "5817ae4948371f9b6b7d94615c0704e6a13ba5a773938351ebd832d0fcdbdf2f";

        async function sha256(str) {
            const buff = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buff))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        function playMedia(stateKey) {
            const media = MEDIA_PATHS[stateKey];
            if (!media) return;

            const imgElem = document.getElementById("bg-img");
            const videoElem = document.getElementById("bg-video");

            if (media.poster) {
                imgElem.src = media.poster;
            }

            if (currentMediaVideo === media.video && media.video !== "") {
                return;
            }
            currentMediaVideo = media.video;

            if (media.video) {
                videoElem.src = media.video;
                videoElem.load();
                
                const playPromise = videoElem.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        videoElem.classList.add("active");
                    }).catch(() => {
                        videoElem.classList.remove("active");
                    });
                }
            } else {
                videoElem.classList.remove("active");
            }
        }

        function updateCardFocus(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const cards = container.querySelectorAll(".select-card");
            cards.forEach((card, idx) => {
                if (idx === selectedIndex) {
                    card.classList.add("selected");
                } else {
                    card.classList.remove("selected");
                }
            });
        }

        function changeState(newState) {
            currentState = newState;
            selectedIndex = 0;

            document.querySelectorAll(".ui-layer").forEach(elem => elem.classList.add("hidden"));
            playMedia(newState);

            if (newState === GAME_STATES.TITLE) {
                document.getElementById("ui-title").classList.remove("hidden");
            } else if (newState === GAME_STATES.GENRE) {
                document.getElementById("ui-genre").classList.remove("hidden");
                updateCardFocus("genre-cards");
            } else if (newState === GAME_STATES.DIFFICULTY) {
                document.getElementById("ui-difficulty").classList.remove("hidden");
                updateCardFocus("diff-cards");
            }
        }

        // キー操作
        document.addEventListener("keydown", (e) => {
            if (!isAuthenticated) return;

            if (e.code === "Space" || e.code === "Enter") {
                e.preventDefault();
            } else {
                return;
            }

            const videoElem = document.getElementById("bg-video");
            if (videoElem.paused && currentMediaVideo) {
                videoElem.play().then(() => videoElem.classList.add("active")).catch(() => {});
            }

            if (currentState === GAME_STATES.TITLE) {
                if (e.code === "Enter" || e.code === "Space") {
                    changeState(GAME_STATES.GENRE);
                }
            } else if (currentState === GAME_STATES.GENRE) {
                if (e.code === "Space") {
                    selectedIndex = (selectedIndex === 0) ? 1 : 0;
                    updateCardFocus("genre-cards");
                } else if (e.code === "Enter") {
                    selectedGenre = selectedIndex === 0 ? "ジャンル A" : "ジャンル B";
                    changeState(GAME_STATES.DIFFICULTY);
                }
            } else if (currentState === GAME_STATES.DIFFICULTY) {
                if (e.code === "Space") {
                    selectedIndex = (selectedIndex === 0) ? 1 : 0;
                    updateCardFocus("diff-cards");
                } else if (e.code === "Enter") {
                    selectedDifficulty = selectedIndex === 0 ? "初級" : "上級";
                }
            }
        });

        // 認証処理（モーダル方式）
        async function handleAuthSubmit(e) {
            if (e.key === "Enter") {
                const inputVal = e.target.value;
                const hash = await sha256(inputVal);
                if (hash === TARGET_HASH) {
                    isAuthenticated = true;
                    document.getElementById("auth-modal").classList.add("hidden");
                    changeState(GAME_STATES.TITLE);
                } else {
                    document.getElementById("auth-error").textContent = "パスワードが正しくありません";
                    e.target.value = "";
                }
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            // 背景画像を即時セット
            playMedia(GAME_STATES.TITLE);
            // パスワード入力にフォーカス
            const passInput = document.getElementById("pass-input");
            if (passInput) passInput.focus();
        });
    </script>
</head>
<body>

    <div id="auth-modal">
        <div class="auth-box">
            <h2>認証が必要です</h2>
            <input type="password" id="pass-input" class="auth-input" placeholder="パスワードを入力" onkeydown="handleAuthSubmit(event)">
            <div id="auth-error" class="auth-error"></div>
        </div>
    </div>

    <div class="bg-container">
        <img id="bg-img" class="bg-media" src="" alt="背景画像">
        <video id="bg-video" class="bg-media" autoplay loop muted playsinline></video>
    </div>

    <div id="ui-title" class="ui-layer hidden">
        <h1 class="title">Title!!</h1>
        <p class="start-msg">PRESS ENTER TO START</p>
    </div>

    <div id="ui-genre" class="ui-layer hidden">
        <h2 class="section-title">SELECT GENRE</h2>
        <div id="genre-cards" class="card-container">
            <div class="select-card">ジャンル A</div>
            <div class="select-card">ジャンル B</div>
        </div>
        <p class="key-guide">[ SPACE ]: 選択移動 / [ ENTER ]: 決定</p>
    </div>

    <div id="ui-difficulty" class="ui-layer hidden">
        <h2 class="section-title">SELECT DIFFICULTY</h2>
        <div id="diff-cards" class="card-container">
            <div class="select-card">初 級</div>
            <div class="select-card">上 級</div>
        </div>
        <p class="key-guide">[ SPACE ]: 選択移動 / [ ENTER ]: 決定</p>
    </div>

</body>
</html>
